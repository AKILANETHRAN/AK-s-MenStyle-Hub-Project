services:
  backend:
    build:
      context: ./stylehub/stylehub-backend
    restart: unless-stopped
    env_file:
      - ./stylehub/stylehub-backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ""
      MONGODB_DB_NAME: stylehub
    volumes:
      - stylehub_sqlite:/app/data
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./stylehub/stylehub-frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  stylehub_sqlite:
