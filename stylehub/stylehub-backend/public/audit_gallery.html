<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AK's MEN STYLE — Garment Image Audit Gallery (1-50)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d0f12; color: #fff; padding: 20px; }
    h1 { color: #d4a359; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: #161920; border: 1px solid #2d3340; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; }
    .img-container { width: 100%; height: 320px; background: #fff; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 10px; }
    .img-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .meta { font-size: 12px; line-height: 1.4; color: #94a3b8; }
    .meta strong { color: #f8fafc; font-size: 13px; }
    .tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-top: 4px; }
    .tag-top { background: #1e3a8a; color: #93c5fd; }
    .tag-bot { background: #14532d; color: #86efac; }
  </style>
</head>
<body>
  <h1>AK's MEN STYLE — Products 1–50 Garment Asset Audit</h1>
  <div class="grid" id="grid"></div>

  <script>
    const products = JSON.parse(new URLSearchParams(window.location.search).get('data') || '[]');
    fetch('/api/products')
      .then(res => res.json())
      .then(data => {
        const prods = (data.data && data.data.products) || data;
        render(prods.slice(0, 50));
      })
      .catch(() => {
        // fallback to relative images
        const items = [];
        for (let i = 1; i <= 50; i++) items.push({ id: i });
        render(items);
      });

    function render(list) {
      const container = document.getElementById('grid');
      container.innerHTML = list.map(p => `
        <div class="card" id="card-${p.id}">
          <div class="img-container">
            <img src="/images/garments/product_${p.id}.png" alt="Garment ${p.id}" />
          </div>
          <div class="meta">
            <strong>#${p.id} ${p.name || ''}</strong><br>
            Category: ${p.category || ''} | Type: ${p.cloth_type || ''}<br>
            Color: ${p.color || ''}<br>
            <span class="tag ${p.id >= 21 && p.id <= 30 ? 'tag-bot' : 'tag-top'}">
              ${p.id >= 21 && p.id <= 30 ? 'BOTTOM' : 'TOP'}
            </span>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
